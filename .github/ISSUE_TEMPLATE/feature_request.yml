name: Feature request
description: Propose a focused improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: user_problem
    attributes:
      label: User problem
      description: Explain who needs this and what currently blocks them.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conversation
        - Evaluation and coaching
        - Catalog and scenarios
        - Team and analytics
        - AI providers
        - Deployment and security
    validations:
      required: true
